<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Primary Page Metadata -->
    <title>Aura AI — Your Personal AI Companion, Friend &amp; Guide</title>
    <meta
      name="description"
      content="A modern, emotionally intelligent AI companion with persistent personal memory, real-time mood awareness, singing &amp; music composition, and hands-free voice interaction."
    />
    <meta name="keywords" content="AI Companion, AI Friend, Emotional AI, Chatbot, Voice AI, Next.js, React, Gemini AI, Personal Memory" />
    <meta name="author" content="Varun Sharma" />
    <meta name="robots" content="index, follow" />

    <!-- Theme & Mobile App Configuration -->
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="application-name" content="Aura AI" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aura AI" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Favicon & Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Open Graph (Facebook / LinkedIn / Discord / Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://github.com/varunnshhh-ux/ai-friend-chatbot" />
    <meta property="og:site_name" content="Aura AI" />
    <meta property="og:title" content="Aura AI — Your Personal AI Companion, Friend &amp; Guide" />
    <meta
      property="og:description"
      content="A warm, empathetic AI friend and guide with persistent long-term memory, mood awareness, original song synthesis, and voice conversations."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aura AI — Your Personal AI Companion, Friend &amp; Guide" />
    <meta
      name="twitter:description"
      content="An emotionally aware AI companion with structured memory, voice interaction, and music generation."
    />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:creator" content="@varunsharma" />

    <!-- Google Fonts Preconnect & Stylesheets -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --bg-dark: #090d16;
        --text-light: #f1f5f9;
        --accent-indigo: #6366f1;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: var(--bg-dark);
        color: var(--text-light);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow-x: hidden;
      }
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: var(--bg-dark);
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .loader-orb {
        width: 64px;
        height: 64px;
        border-radius: 20px;
        background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
        box-shadow: 0 0 35px rgba(99, 102, 241, 0.45);
        animation: orb-pulse 2s ease-in-out infinite alternate;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .loader-text {
        margin-top: 18px;
        font-family: 'Outfit', sans-serif;
        font-weight: 700;
        font-size: 18px;
        letter-spacing: -0.02em;
        background: linear-gradient(90deg, #818cf8, #c084fc, #fb7185);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .loader-sub {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 4px;
      }
      @keyframes orb-pulse {
        0% { transform: scale(0.95); filter: blur(0px); }
        100% { transform: scale(1.08); filter: blur(2px); box-shadow: 0 0 50px rgba(168, 85, 247, 0.6); }
      }
    </style>
  </head>
  <body class="bg-zinc-950 text-zinc-100 min-h-screen">
    <!-- Application Mount Points for Next.js / React -->
    <div id="__next">
      <div id="root">
        <div id="app-loader">
          <div class="loader-orb">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
            </svg>
          </div>
          <div class="loader-text">Aura AI</div>
          <div class="loader-sub">Loading your personal companion...</div>
        </div>
      </div>
    </div>

    <script>
      (function() {
        window.addEventListener('DOMContentLoaded', function() {
          var checkHydration = setInterval(function() {
            var loader = document.getElementById('app-loader');
            var nextContainer = document.getElementById('__next');
            if (loader && nextContainer && nextContainer.children.length > 1) {
              loader.style.opacity = '0';
              setTimeout(function() {
                if (loader.parentNode) loader.parentNode.removeChild(loader);
              }, 400);
              clearInterval(checkHydration);
            }
          }, 100);

          setTimeout(function() {
            var loader = document.getElementById('app-loader');
            if (loader) {
              loader.style.opacity = '0';
              setTimeout(function() {
                if (loader.parentNode) loader.parentNode.removeChild(loader);
              }, 400);
            }
          }, 2500);
        });
      })();
    </script>
  </body>
</html>
